[general]
bars = 10
framerate = 50
autosens = 1
sensitivity = 140
lower_cutoff_freq = 50
higher_cutoff_freq = 11000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 16
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 40
